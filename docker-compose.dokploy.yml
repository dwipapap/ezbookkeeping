services:
  ezbookkeeping:
    image: ghcr.io/dwipapap/ezbookkeeping:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      EBK_SERVER_DOMAIN: ${EBK_SERVER_DOMAIN}
      EBK_SERVER_ROOT_URL: ${EBK_SERVER_ROOT_URL}
      EBK_SERVER_ENABLE_GZIP: ${EBK_SERVER_ENABLE_GZIP:-true}
      EBK_SECURITY_SECRET_KEY: ${EBK_SECURITY_SECRET_KEY}
      EBK_DATABASE_TYPE: ${EBK_DATABASE_TYPE:-sqlite3}
      EBK_USER_ENABLE_REGISTER: ${EBK_USER_ENABLE_REGISTER:-true}
    volumes:
      - ezbookkeeping-data:/ezbookkeeping/data
      - ezbookkeeping-storage:/ezbookkeeping/storage
      - ezbookkeeping-log:/ezbookkeeping/log
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz.json >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ezbookkeeping-data:
  ezbookkeeping-storage:
  ezbookkeeping-log:
