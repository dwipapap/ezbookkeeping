name: Build & Push Docker Image (GHCR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set build metadata
        id: build_meta
        run: |
          echo "unixtime=$(date '+%s')" >> "$GITHUB_OUTPUT"
          echo "date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.build_meta.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_UNIXTIME=${{ steps.build_meta.outputs.unixtime }}
            BUILD_DATE=${{ steps.build_meta.outputs.date }}
            BUILD_NODE_OPTIONS=--max-old-space-size=4096
            SKIP_TESTS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy auto-deploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
          else
            echo "DOKPLOY_WEBHOOK_URL secret not configured; skipping webhook trigger."
          fi
